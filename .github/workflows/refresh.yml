name: Refresh project index
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
  schedule:
    - cron: '25 0 * * *'
permissions:
  contents: write
  pages: write
  actions: read
concurrency:
  group: project-index-main
  cancel-in-progress: false
jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run build && npm run check
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Discover public Pages sites
        id: discovery
        continue-on-error: true
        run: npm run sync
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build && npm run check
      - name: Commit generated index and snapshot
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/discovered.json sitemap.xml
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No published changes; skip bot commit and redundant Pages request.'
          else
            git commit -m 'chore: refresh curated project index'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Request Pages rebuild if no same-SHA build exists
        # Preserve the explicit API fallback for GITHUB_TOKEN bot commits, but
        # avoid requesting a second build when Pages already queued this SHA.
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = 'true' ]; then
            expected_sha="$(git rev-parse HEAD)"
            for attempt in 1 2 3 4; do
              existing="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=dynamic&per_page=20" \
                --jq ".workflow_runs[] | select(.head_sha == \"${expected_sha}\" and (.status == \"queued\" or .status == \"in_progress\" or .conclusion == \"success\")) | .id" 2>/dev/null || true)"
              if [ -n "$existing" ]; then
                echo "Existing native Pages build for ${expected_sha}: ${existing}; skip duplicate request."
                exit 0
              fi
              sleep 2
            done
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report discovery failure
        if: steps.discovery.outcome == 'failure'
        run: |
          echo 'Published using the last successful snapshot. Discovery requires attention.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
